<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace - Test Suite</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h1 class="mb-4">🧪 AI Workspace Test Suite</h1>
    
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Test Results</h5>
        <button id="runAllTests" class="btn btn-primary">Run All Tests</button>
      </div>
      <div class="card-body">
        <div id="testResults"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Test Summary</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-3">
            <div class="text-center">
              <h3 id="totalTests" class="display-4">0</h3>
              <small class="text-muted">Total</small>
            </div>
          </div>
          <div class="col-md-3">
            <div class="text-center">
              <h3 id="passedTests" class="display-4 text-success">0</h3>
              <small class="text-muted">Passed</small>
            </div>
          </div>
          <div class="col-md-3">
            <div class="text-center">
              <h3 id="failedTests" class="display-4 text-danger">0</h3>
              <small class="text-muted">Failed</small>
            </div>
          </div>
          <div class="col-md-3">
            <div class="text-center">
              <h3 id="skippedTests" class="display-4 text-warning">0</h3>
              <small class="text-muted">Skipped</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="test.js"></script>
</body>
</html>
